name: Damage Calculation Test

on:
  push:
    branches: [ main-2026 ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js v22.22.0
      uses: actions/setup-node@v4
      with:
        node-version: '22.22.0'
    
    - run: yarn install
    - name: Run tests with JUnit as reporter
      run: npx jest --ci --reporters=default --reporters=jest-junit
      env:
        JEST_JUNIT_OUTPUT: "./junit/test_results.xml"
    - uses: actions/upload-artifact@c4
      with:
        path: ./junit/test_results/xml
      if: always()
